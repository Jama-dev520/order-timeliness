name: refresh-dashboard

# 每 2 小时抓一次数并重新发布 => GitHub Pages
# 手动：仓库 Actions 页 → refresh-dashboard → Run workflow
#
# 需要配置的 Secrets（Settings → Secrets and variables → Actions）：
#   OC_COOKIE          登录态，形如 hk-sit=xxxxxxxx-xxxx-...（约 4 天过期，失效后本 job 会失败提醒你）
#   OC_SITE_PASSWORD   看板访问口令，浏览器解密 data.bin 用
#   OC_HOST_US         【必填】US 区域接口主机根地址
#   OC_PORTAL          【必填】后台门户地址（Referer / Origin）
#   OC_SSO_URL         【必填】SSO 登录入口
#   OC_HOST_UK / OC_HOST_AU   可选，只有 OC_REGION=all/uk/au 时才需要
#   OC_DEPOP_TRACK     可选，Depop 对外轨迹页域名；不配则明细表不显示 ↗ 外链
#
# 这些地址刻意不写进仓库：公开仓库里看不到任何内部系统域名，只在 Secret 里。
#
# Pages 设置：Settings → Pages → Source 选「GitHub Actions」

on:
  schedule:
    # 避开整点：GitHub 的 schedule 在 0 分最拥堵，实测常延迟 10~30 分钟甚至跳过
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '这次手动触发的原因（只写进日志）'
        required: false
        default: '手动刷新'

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 写入配置
        env:
          OC_COOKIE: ${{ secrets.OC_COOKIE }}
          OC_SITE_PASSWORD: ${{ secrets.OC_SITE_PASSWORD }}
          OC_HOST_US: ${{ secrets.OC_HOST_US }}
          OC_HOST_UK: ${{ secrets.OC_HOST_UK }}
          OC_HOST_AU: ${{ secrets.OC_HOST_AU }}
          OC_PORTAL: ${{ secrets.OC_PORTAL }}
          OC_SSO_URL: ${{ secrets.OC_SSO_URL }}
          OC_DEPOP_TRACK: ${{ secrets.OC_DEPOP_TRACK }}
        run: |
          missing=""
          [ -z "$OC_COOKIE" ]        && missing="$missing OC_COOKIE"
          [ -z "$OC_SITE_PASSWORD" ] && missing="$missing OC_SITE_PASSWORD"
          [ -z "$OC_HOST_US" ]       && missing="$missing OC_HOST_US"
          [ -z "$OC_PORTAL" ]        && missing="$missing OC_PORTAL"
          [ -z "$OC_SSO_URL" ]       && missing="$missing OC_SSO_URL"
          if [ -n "$missing" ]; then
            echo "缺少 Secret:$missing"
            echo "这些地址不进仓库，必须配在 Settings → Secrets and variables → Actions"
            exit 1
          fi
          cat > .env <<EOF
          OC_COOKIE=$OC_COOKIE
          OC_REGION=us
          OC_DAYS=14
          OC_START_DATE=2026/10/19
          OC_KPI_START=2026/10/29
          OC_DETAIL_START=2026/10/19
          OC_SITE_PASSWORD=$OC_SITE_PASSWORD
          OC_HOST_US=$OC_HOST_US
          OC_HOST_UK=$OC_HOST_UK
          OC_HOST_AU=$OC_HOST_AU
          OC_PORTAL=$OC_PORTAL
          OC_SSO_URL=$OC_SSO_URL
          OC_DEPOP_TRACK=$OC_DEPOP_TRACK
          EOF
          mkdir -p data logs
          echo "配置已写入（cookie 长度 ${#OC_COOKIE}）"

      - name: 先探一次接口（失败即停，避免白跑 15 分钟）
        run: python login_browser.py --check

      - name: 抓数 + 重算异常清单
        run: python -u refresh_all.py

      - name: 生成加密站点
        run: python build_site.py --out site

      - name: 自检产物
        env:
          OC_HOST_US: ${{ secrets.OC_HOST_US }}
          OC_PORTAL: ${{ secrets.OC_PORTAL }}
          OC_SSO_URL: ${{ secrets.OC_SSO_URL }}
        run: |
          test -s site/index.html || { echo "index.html 缺失"; exit 1; }
          test -s site/data.bin    || { echo "data.bin 缺失"; exit 1; }
          # 双保险：模板里不能残留业务数据
          if grep -q '"ocOrderNo"' site/index.html; then
            echo "index.html 里残留了订单数据，拒绝发布"; exit 1
          fi
          # 三保险：内部系统域名不能出现在公开页面里
          for u in "$OC_HOST_US" "$OC_PORTAL" "$OC_SSO_URL"; do
            h=$(printf '%s' "$u" | sed -E 's#^https?://##; s#/.*##')
            if [ -n "$h" ] && grep -qF "$h" site/index.html; then
              echo "产物里泄漏了内部域名 $h，拒绝发布"; exit 1
            fi
          done
          ls -lh site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
