# 复制成 k8s/secret.yaml 再填真实值，**不要提交到仓库**
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   # 编辑里面两行
#   kubectl apply -f k8s/secret.yaml
#
# 或者用命令行直接生成，避免密钥落到文件里：
#
#   kubectl -n oc-timeliness create secret generic oc-timeliness-secret \
#     --from-literal=OC_COOKIE='hk-sit=xxxx-xxxx; language=en-US' \
#     --from-literal=OC_DASHBOARD_TOKEN='key-a,key-b' \
#     --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: oc-timeliness-secret
  namespace: oc-timeliness
type: Opaque
stringData:
  # 后台 Cookie：只要 hk-sit=... 这一段就够（浏览器 F12 → Network → 任意请求的 Cookie 头）
  # 过期后重新粘贴并 apply，CronJob 下一轮自动生效，不用重启 Pod
  OC_COOKIE: "hk-sit=REPLACE_ME; language=en-US; hasGreet=1"
  # 看板访问口令，逗号分隔可配多个（一人一个，便于单独撤销）
  OC_DASHBOARD_TOKEN: "REPLACE_ME"
